name: build

# Builds JOYTEST.TOS (French) and JOYTSTEN.TOS (English) and checks them.
# Pushing a v* tag also publishes a GitHub release with both programs.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache vasm
        uses: actions/cache@v4
        with:
          path: .tools
          key: vasm-${{ runner.os }}-${{ hashFiles('scripts/get-vasm.sh') }}

      - name: Build vasm (68000 assembler)
        run: sh scripts/get-vasm.sh .tools

      - name: Build and check
        run: make check VASM=.tools/vasm/vasmm68k_mot

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: joystick-tester
          path: |
            build/JOYTEST.TOS
            build/JOYTSTEN.TOS

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/JOYTEST.TOS
            build/JOYTSTEN.TOS
